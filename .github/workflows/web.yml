# Browser-Version (PC und Handy): testet, baut und veröffentlicht das Spiel auf GitHub Pages.
# Adresse nach dem ersten Lauf auf main: https://valleralle.github.io/game_pilot/
# Einmalig nötig: Repo → Settings → Pages → Source: „GitHub Actions“.
name: Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    if: github.ref == 'refs/heads/main'
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
