# Android-App: baut bei jedem Push eine APK (unter „Actions“ → Lauf → Artifacts herunterladen).
# Release: Kommt auf main eine Version aus package.json an, zu der es noch keinen Tag gibt, und liegen
# dafür Release-Notizen in docs/releases/v<Version>.md, legt der Lauf Tag und Release v<Version> selbst
# an und hängt die APK an (siehe werkzeuge/android/release.mjs). Ein von Hand gesetzter Tag v* erzeugt
# ebenfalls ein Release.
name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Das Android-SDK ist auf den GitHub-Runnern vorinstalliert; nur die Lizenzen bestätigen
      - name: Android-SDK prüfen
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - run: npm install --no-audit --no-fund
      - run: npm test

      # Neue Version auf main mit Release-Notizen? Dann setzt das Skript RELEASE_TAG und NOTIZEN.
      - name: Release fällig?
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node werkzeuge/android/release.mjs

      # Version: beim Release dessen Name (v0.2.0 → 0.2.0), sonst die aus package.json plus Laufnummer
      - name: Version bestimmen
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            name="${RELEASE_TAG#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="$(node -p "require('./package.json').version")-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSIONS_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSIONS_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: APK bauen
        run: |
          set -o pipefail
          npm run android 2>&1 | tee bau.log

      # Fehler als Anmerkung am Lauf, damit man sie ohne das ganze Log sieht
      - name: Fehler zusammenfassen
        if: failure()
        run: |
          [ -f bau.log ] || exit 0
          grep -iE "error|failed|what went wrong|exception" bau.log | head -20 | while IFS= read -r zeile; do
            echo "::error::${zeile}"
          done

      # Jede APK muss mit dem Schlüssel aus dem Repo signiert sein – sonst lässt sie sich nicht über
      # eine ältere installieren („App nicht installiert“)
      - name: Signatur prüfen
        run: |
          erwartet=$(keytool -exportcert -keystore werkzeuge/android/debug.keystore -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee signatur.txt
          if ! grep -qi "SHA-256 digest: $erwartet" signatur.txt; then
            echo "::error::APK ist nicht mit werkzeuge/android/debug.keystore signiert (erwartet $erwartet)"
            exit 1
          fi

      - name: APK benennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "street-fencer-${VERSIONS_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: street-fencer-${{ env.VERSIONS_NAME }}
          path: street-fencer-*.apk

      # Release-Notizen aus docs/releases/<tag>.md, falls es die Datei gibt
      - name: Release-Notizen suchen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          datei="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$datei" ] && echo "NOTIZEN=$datei" >> "$GITHUB_ENV" || true

      # Legt den Tag an (beim Release von main aus) bzw. nimmt den gesetzten, und hängt die APK an
      - if: env.RELEASE_TAG != '' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Street Fencer ${{ env.RELEASE_TAG || github.ref_name }}
          body_path: ${{ env.NOTIZEN }}
          files: street-fencer-*.apk
